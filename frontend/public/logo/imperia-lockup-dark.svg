<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 310 50" fill="none" role="img" aria-label="IMPERIA Luxury Estates">
  <!--
    IMPERIA — Luxury Estates
    Primary horizontal lockup — dark version

    Layout (left → right):
      [0–38]   Icon mark (architectural "I", scaled to 50-unit tall viewBox)
      [46–52]  Hairline vertical divider (#E8E4DA)
      [60–...]  Wordmark ("IMPERIA" + "LUXURY ESTATES")

    This is the primary navbar logo. The icon mark is sized so the amber crown
    aligns with the cap-height of the wordmark and the plinth aligns with its
    baseline — giving the whole lockup a single, unified reading line.
  -->

  <!-- ── Icon mark ─────────────────────────────── -->
  <!-- Crown — amber #F5A623 -->
  <rect x="0" y="8" width="38" height="5.5" fill="#F5A623"/>
  <!-- Column — near-black -->
  <rect x="14" y="13.5" width="10" height="23" fill="#1A1A1A"/>
  <!-- Plinth — near-black -->
  <rect x="0" y="36.5" width="38" height="5.5" fill="#1A1A1A"/>

  <!-- ── Divider ──────────────────────────────── -->
  <line x1="52" y1="9" x2="52" y2="41" stroke="#E8E4DA" stroke-width="1"/>

  <!-- ── Wordmark ─────────────────────────────── -->
  <!-- "IMPERIA" -->
  <text
    x="64"
    y="33"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="800"
    font-size="21"
    letter-spacing="5"
    fill="#1A1A1A"
  >IMPERIA</text>

  <!-- "LUXURY ESTATES" -->
  <text
    x="65"
    y="44"
    font-family="'Plus Jakarta Sans', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif"
    font-weight="500"
    font-size="6"
    letter-spacing="3.2"
    fill="#F5A623"
  >LUXURY ESTATES</text>
</svg>
